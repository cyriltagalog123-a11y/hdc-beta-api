<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Reset HDC Password</title>
    <link rel="stylesheet" href="/reset-password/reset-password.css">
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">HDC</div>
      <h1>Create a new password</h1>
      <p class="intro">
        Use the one-time HDC reset link you received. A successful reset signs
        the account out on every device.
      </p>
      <form id="reset-form">
        <label for="password">New password</label>
        <input id="password" name="password" type="password"
               minlength="12" maxlength="128" autocomplete="new-password"
               required>
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" name="confirm-password" type="password"
               minlength="12" maxlength="128" autocomplete="new-password"
               required>
        <button id="submit" type="submit">Reset password</button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script src="/reset-password/reset-password.js" defer></script>
  </body>
</html>
