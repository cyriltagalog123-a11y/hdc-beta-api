<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HelpDesk Connect brings technology support requests, trusted technicians, active services, and service records into one connected workspace.">
  <meta name="theme-color" content="#041426">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HelpDesk Connect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HelpDesk Connect</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="hdc_startup.css">
</head>
<body>
  <main id="hdc-startup" aria-live="polite" aria-busy="true">
    <section class="hdc-startup-card" aria-labelledby="hdc-startup-title">
      <div class="hdc-startup-brand">
        <div class="hdc-startup-eyebrow">
          <span class="hdc-startup-live" aria-hidden="true"></span>
          HDC support network
        </div>
        <img
          class="hdc-startup-mark"
          src="hdc_mark.png"
          alt=""
          aria-hidden="true"
          width="96"
          height="96"
        >
        <h1 id="hdc-startup-title">HelpDesk<br>Connect</h1>
        <p>Technical support, connected.</p>
        <div class="hdc-startup-route" aria-hidden="true">
          <span></span><i></i><span></span><i></i><span></span>
        </div>
      </div>
      <div class="hdc-startup-status">
        <span class="hdc-startup-build">Build 24</span>
        <p id="hdc-startup-message">Opening your secure workspace…</p>
        <div class="hdc-startup-spinner" aria-hidden="true"></div>
        <button id="hdc-startup-recover" type="button" hidden>
          Reload latest Build 24
        </button>
        <p id="hdc-startup-detail" class="hdc-startup-detail" hidden>
          This refreshes application files only. Your HDC account and server
          data are not deleted.
        </p>
      </div>
    </section>
  </main>
  <noscript>
    HelpDesk Connect requires JavaScript. Enable JavaScript, then reload this
    page.
  </noscript>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="hdc_startup.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
