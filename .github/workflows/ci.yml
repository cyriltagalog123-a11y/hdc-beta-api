name: HDC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hdc-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provider portability boundaries
        run: npm run check:portability

      - name: Immutable migration checksums
        run: npm run check:migrations

      - name: Release synchronization
        run: npm run check:release

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Secret-pattern sanity scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='*.lock' \
            --exclude='ci.yml' \
            '(postgres(ql)?://[^[:space:]]+:[^[:space:]]+@|npg_[A-Za-z0-9]+|HDC-Customer#|HDC-Tech#)' .; then
            echo 'Potential secret pattern found.'
            exit 1
          fi
          echo 'No known HDC secret patterns found.'

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hdc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hdc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      restore-postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hdc_restore
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hdc_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HDC_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hdc_test
      HDC_ALLOW_TEST_DATABASE_RESET: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild a clean database from migrations
        run: npm run db:rehearse-clean

      - name: Offers, acceptance, chat, payment, dispute, and isolation tests
        run: npm run test:postgres

      - name: Install PostgreSQL 18 client
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Production-shaped encrypted backup and clean restore
        env:
          HDC_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hdc_test
          HDC_RESTORE_DATABASE_URL: postgres://postgres@localhost:5433/hdc_restore
          HDC_BACKUP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          HDC_ALLOW_RESTORE_RESET: '1'
        run: npm run test:backup-rehearsal

  flutter-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read pinned Flutter version
        id: flutter-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .flutter-version)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Analyze, test, and build Flutter web
        run: npm run build:web

      - name: Read release artifact name
        id: release-artifact
        shell: bash
        run: |
          set -euo pipefail
          build_number="$(node -p "require('./package.json').version.match(/build\.(\d+)$/)[1]")"
          echo "name=hdc-web-build${build_number}" >> "$GITHUB_OUTPUT"

      - name: Upload verified Flutter web bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release-artifact.outputs.name }}
          path: build/web
          if-no-files-found: error
          retention-days: 3
