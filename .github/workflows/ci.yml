name: HDC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provider portability boundaries
        run: npm run check:portability

      - name: Immutable migration checksums
        run: npm run check:migrations

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Secret-pattern sanity scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='*.lock' \
            --exclude='ci.yml' \
            '(postgres(ql)?://[^[:space:]]+:[^[:space:]]+@|npg_[A-Za-z0-9]+|HDC-Customer#|HDC-Tech#)' .; then
            echo 'Potential secret pattern found.'
            exit 1
          fi
          echo 'No known HDC secret patterns found.'

  flutter-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Analyze, test, and build Flutter web
        run: npm run build:web

      - name: Upload verified Flutter web bundle
        uses: actions/upload-artifact@v4
        with:
          name: hdc-web-build18
          path: build/web
          if-no-files-found: error
          retention-days: 3
