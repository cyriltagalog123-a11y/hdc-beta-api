name: HDC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provider portability boundaries
        run: npm run check:portability

      - name: Immutable migration checksums
        run: npm run check:migrations

      - name: Release synchronization
        run: npm run check:release

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Secret-pattern sanity scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='*.lock' \
            --exclude='ci.yml' \
            '(postgres(ql)?://[^[:space:]]+:[^[:space:]]+@|npg_[A-Za-z0-9]+|HDC-Customer#|HDC-Tech#)' .; then
            echo 'Potential secret pattern found.'
            exit 1
          fi
          echo 'No known HDC secret patterns found.'

  flutter-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Read pinned Flutter version
        id: flutter-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .flutter-version)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Analyze, test, and build Flutter web
        run: npm run build:web

      - name: Upload verified Flutter web bundle
        uses: actions/upload-artifact@v4
        with:
          name: hdc-web-build22
          path: build/web
          if-no-files-found: error
          retention-days: 3

      - name: Synchronize verified web bundle with review branch
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HDC_REVIEW_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f build/web/.last_build_id
          git add -A -f build/web
          if git diff --cached --quiet; then
            echo "Verified Flutter web bundle is already synchronized."
            exit 0
          fi
          git commit -m "Synchronize verified Build 22 web bundle"
          git push origin "HEAD:${HDC_REVIEW_BRANCH}"
