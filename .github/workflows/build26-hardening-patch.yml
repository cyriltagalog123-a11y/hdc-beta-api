name: Build 26 hardening patch

on:
  push:
    branches:
      - codex/build26-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v5
        with:
          ref: codex/build26-hardening

      - name: Apply Build 26 hardening patch
        run: python3 scripts/build26_hardening_patch.py

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # CI workflow changes are committed separately through the owner-authorized
          # repository connection because the Actions token does not have workflows permission.
          git restore .github/workflows/ci.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Build 26 hardening patch already applied."
            exit 0
          fi
          git commit -m "Apply Build 26 hardening baseline"
          git push origin HEAD:codex/build26-hardening
