name: Build 27 Release Patch

on:
  push:
    branches:
      - codex/build27-knowledge-base

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build 27 branch
        uses: actions/checkout@v4
        with:
          ref: codex/build27-knowledge-base
          fetch-depth: 0

      - name: Apply Build 27 release/readiness patch
        run: python3 scripts/build27_release_patch.py

      - name: Commit patched release files
        run: |
          if git diff --quiet -- package-lock.json lib/features/dashboard/dashboard_screen.dart netlify/functions/api.mts; then
            echo "Build 27 release files are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json lib/features/dashboard/dashboard_screen.dart netlify/functions/api.mts
          git commit -m "Build 27: synchronize release markers and readiness"
          git push origin HEAD:codex/build27-knowledge-base
