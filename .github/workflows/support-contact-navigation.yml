name: Wire Support and Contact Owner Navigation

on:
  push:
    branches:
      - build-25-support-contact
    paths:
      - scripts/add_support_contact_navigation.py
      - .github/workflows/support-contact-navigation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: build-25-support-contact
          fetch-depth: 0
      - run: python3 scripts/add_support_contact_navigation.py
      - name: Commit navigation wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/dashboard/dashboard_screen.dart
          git commit -m "Wire Support HDC and Contact Owner navigation"
          git push origin HEAD:build-25-support-contact
