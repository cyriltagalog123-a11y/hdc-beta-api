name: Build 26 backup verifier sync

on:
  push:
    branches:
      - codex/build26-hardening

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/build26-hardening
          fetch-depth: 0
      - name: Apply verifier synchronization
        run: python scripts/build26_sync_backup_verifier.py
      - name: Commit verifier correction if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/postgres/verify-backup.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Backup verifier already synchronized."
            exit 0
          fi
          git commit -m "Build 26: verify current and superseded legal documents after restore"
          git push origin HEAD:codex/build26-hardening
