name: Build 26 community staged patch

on:
  push:
    branches:
      - codex/build26-ratings-suggestions-badges
    paths:
      - scripts/build26_community_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/build26-ratings-suggestions-badges
          fetch-depth: 0
      - name: Apply Build 26 community patch
        run: python3 scripts/build26_community_patch.py
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib netlify migrations docs tests
          git commit -m "Build 26 follow-up: wire ratings suggestions and badges"
          git push origin HEAD:codex/build26-ratings-suggestions-badges
