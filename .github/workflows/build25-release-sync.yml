name: Build 25 release sync

on:
  push:
    branches:
      - build-25-complete
    paths:
      - scripts/build25_release_sync.py

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v5
        with:
          ref: build-25-complete
          fetch-depth: 0

      - name: Synchronize Build 25 release markers
        run: python3 scripts/build25_release_sync.py

      - name: Commit release synchronization
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Release markers already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json lib netlify web .github/workflows/ci.yml
          git commit -m "Build 25G: synchronize remaining release markers"
          git push origin HEAD:build-25-complete
