name: Build 24.2 Wiring

on:
  push:
    branches:
      - codex/build24-2-location-role-controls
    paths:
      - scripts/build24_2_wire.py
      - .github/workflows/build24-2-wiring.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build 24.2
        uses: actions/checkout@v4
        with:
          ref: codex/build24-2-location-role-controls
          fetch-depth: 0
      - name: Apply controlled-location wiring
        run: python3 scripts/build24_2_wire.py
      - name: Commit wired product code
        shell: bash
        run: |
          rm -f scripts/build24_2_wire.py .github/workflows/build24-2-wiring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build 24.2: complete controlled-location and role-admin wiring"
          git push origin HEAD:codex/build24-2-location-role-controls
