name: Build 24.2 Test Diagnostic

on:
  push:
    branches:
      - codex/build24-2-location-role-controls
    paths:
      - .github/workflows/build24-2-test-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/build24-2-location-role-controls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture Vitest result
        shell: bash
        run: |
          npx vitest run --reporter=json --outputFile=build24-2-test-result.json || true
          test -f build24-2-test-result.json
      - name: Commit diagnostic result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build24-2-test-result.json
          git commit -m "Build 24.2: capture failing test diagnostics"
          git push origin HEAD:codex/build24-2-location-role-controls
