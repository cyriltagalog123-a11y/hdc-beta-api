name: Build 26 owner suggestion test fix

on:
  push:
    branches:
      - codex/build26-dashboard-suggestions-notifications
    paths:
      - scripts/build26_owner_suggestion_test_fix.py
      - .github/workflows/build26-owner-suggestion-test-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/build26-dashboard-suggestions-notifications
          fetch-depth: 0
      - name: Update owner-only suggestion regression
        run: python3 scripts/build26_owner_suggestion_test_fix.py
      - name: Commit regression update
        run: |
          git config user.name "cyriltagalog123-a11y"
          git config user.email "cyril.tagalog123@gmail.com"
          git add tests/build26-community.integration.test.ts
          if git diff --cached --quiet; then
            echo "No test change to commit."
            exit 0
          fi
          git commit -m "Build 26: enforce owner-only suggestion queue regression"
          git push origin HEAD:codex/build26-dashboard-suggestions-notifications
