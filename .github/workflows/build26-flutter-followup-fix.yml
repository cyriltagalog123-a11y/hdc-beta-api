name: Build 26 Flutter follow-up fix

on:
  push:
    branches:
      - codex/build26-ratings-suggestions-badges
    paths:
      - scripts/build26_flutter_followup_fix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/build26-ratings-suggestions-badges
          fetch-depth: 0
      - name: Apply Flutter follow-up fix
        run: python3 scripts/build26_flutter_followup_fix.py
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib
          git commit -m "Build 26 follow-up: support completed marketplace states in Flutter"
          git push origin HEAD:codex/build26-ratings-suggestions-badges
