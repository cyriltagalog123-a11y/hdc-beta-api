name: Build 26 final auth source synchronization

on:
  push:
    branches:
      - codex/build26-hardening

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/build26-hardening
          fetch-depth: 0
      - name: Restore canonical auth test and synchronize release label
        shell: bash
        run: |
          set -euo pipefail
          git show 07523ad705cc6be8b1e31bd6b7e28541f92dd292:test/unit/hdc_api_auth_gateway_test.dart > test/unit/hdc_api_auth_gateway_test.dart
          python - <<'PY'
          from pathlib import Path

          test = Path('test/unit/hdc_api_auth_gateway_test.dart')
          text = test.read_text(encoding='utf-8')
          old = "expect(request.url.path, '/api/auth/register-v2');"
          new = "expect(request.url.path, '/api/auth/register');"
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale register-v2 assertion, found {text.count(old)}')
          test.write_text(text.replace(old, new), encoding='utf-8')

          login = Path('lib/features/authentication/login_screen.dart')
          text = login.read_text(encoding='utf-8')
          old = 'CONTROLLED BETA • BUILD 25'
          count = text.count(old)
          if count not in (0, 2):
              raise SystemExit(f'expected zero or two Build 25 login labels, found {count}')
          if count == 2:
              text = text.replace(old, 'CONTROLLED BETA • BUILD 26')
          if 'CONTROLLED BETA • BUILD 25' in text:
              raise SystemExit('stale Build 25 login label remains')
          if text.count('CONTROLLED BETA • BUILD 26') < 2:
              raise SystemExit('Build 26 login labels missing')
          login.write_text(text, encoding='utf-8')
          PY
      - name: Commit synchronized source if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/unit/hdc_api_auth_gateway_test.dart lib/features/authentication/login_screen.dart
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Source already synchronized.'
            exit 0
          fi
          git commit -m "Build 26: synchronize final auth release checks"
          git push origin HEAD:codex/build26-hardening
